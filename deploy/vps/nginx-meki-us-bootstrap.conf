# MEKI — TEMPORARY HTTP-only site used once, to obtain the first certificates (nginx -t cannot pass for the full HTTPS
# config while its certificate files do not exist). Install as /etc/nginx/sites-available/meki-us, issue the certificates
# with `certbot certonly --webroot -w /var/www/letsencrypt ...` (runbook), then replace it with nginx-meki-us.conf.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name meki-us.org www.meki-us.org admin.meki-us.org api.meki-us.org meki-us.com www.meki-us.com meki-us.net www.meki-us.net;
    server_tokens off;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 503; }
}
