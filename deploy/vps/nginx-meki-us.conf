# MEKI — nginx 1.24 site configuration for the DigitalOcean VPS (meki-us.org). Install as /etc/nginx/sites-available/meki-us.
# Replaces the API-only template (nginx-meki-api.conf). All upstreams are loopback-only PM2 processes:
#   meki-web 127.0.0.1:3000 · meki-admin 127.0.0.1:3001 · meki-api 127.0.0.1:6666   (ports 3000/3001/6666/3306 stay closed in ufw)
#   internal SSR proxy 127.0.0.1:8080 → meki-api (Node fetch cannot use port 6666; see the last server block)
#
# Certificates (issued with `certbot certonly --webroot`, so certbot never edits this file — see the runbook):
#   /etc/letsencrypt/live/meki-us.org/        meki-us.org, www.meki-us.org, admin.meki-us.org, api.meki-us.org
#   /etc/letsencrypt/live/meki-us-redirects/  meki-us.com, www.meki-us.com, meki-us.net, www.meki-us.net
# Until both exist, `nginx -t` fails: install nginx-meki-us-bootstrap.conf first, issue the certificates, then this file.

limit_req_zone $binary_remote_addr zone=meki_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=meki_admin_api:10m rate=10r/s;

# ── port 80: ACME challenges for every name, everything else → https://meki-us.org (or the same host for .org subdomains)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name meki-us.org www.meki-us.org admin.meki-us.org api.meki-us.org meki-us.com www.meki-us.com meki-us.net www.meki-us.net;
    server_tokens off;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / {
        if ($host ~* ^(admin|api)\.meki-us\.org$) { return 301 https://$host$request_uri; }
        return 301 https://meki-us.org$request_uri;
    }
}

# ── shared TLS settings are repeated per server (nginx 1.24: `listen ... http2`; the `http2 on` directive needs 1.25.1+)

# ── www.meki-us.org → apex
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.meki-us.org;
    ssl_certificate     /etc/letsencrypt/live/meki-us.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meki-us.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    return 301 https://meki-us.org$request_uri;
}

# ── meki-us.com / meki-us.net (+ www) → https://meki-us.org (path and query preserved)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name meki-us.com www.meki-us.com meki-us.net www.meki-us.net;
    ssl_certificate     /etc/letsencrypt/live/meki-us-redirects/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meki-us-redirects/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    return 301 https://meki-us.org$request_uri;
}

# ── public website + donor journeys (Next.js, meki-web :3000)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name meki-us.org;
    ssl_certificate     /etc/letsencrypt/live/meki-us.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meki-us.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    server_tokens off;
    # Security headers (CSP, HSTS, X-Frame-Options, …) are set by Next.js (apps/web/next.config.ts); not duplicated here.
    client_max_body_size 1m;

    # CMS live publishing: the API calls the website's revalidation route over loopback (127.0.0.1:3000) only.
    # The route is never reachable from the internet (it also requires the server-only MEKI_REVALIDATE_SECRET).
    location ^~ /api/internal/ { return 404; }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }
}

# ── admin dashboard (Next.js, meki-admin :3001). /api/v1 goes straight to the API (same origin for the browser, so the
#    __Host- session cookie is bound to admin.meki-us.org; one proxy hop, matching TRUST_PROXY=1).
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.meki-us.org;
    ssl_certificate     /etc/letsencrypt/live/meki-us.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meki-us.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    server_tokens off;
    # Media uploads and SDI report files: the API caps files at 10 MB; the multipart envelope needs a little more.
    client_max_body_size 12m;

    location /api/v1/ {
        limit_req zone=meki_admin_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:6666;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 120s;
    }
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }
}

# ── public API (NestJS, meki-api :6666). Only the API and public media are exposed; private storage is never served.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.meki-us.org;
    ssl_certificate     /etc/letsencrypt/live/meki-us.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meki-us.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    server_tokens off;
    # HSTS on the API host (no includeSubDomains until the domain plan is decided — docs/38 §3.7)
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 12m;
    proxy_read_timeout 120s;

    location /api/v1/ {
        limit_req zone=meki_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:6666;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
    }
    location /media/uploads/ {
        proxy_pass http://127.0.0.1:6666;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / { return 404; }
}

# ── INTERNAL API endpoint for server-side rendering (meki-web → nginx → meki-api), loopback only.
#    Node's fetch() refuses port 6666 ("bad port", WHATWG fetch blocked-port list), so the website cannot call the API on its
#    own port. meki-web uses API_INTERNAL_URL=http://127.0.0.1:8080/api/v1 (verified working on the VPS). Never exposed: it
#    listens on 127.0.0.1 only and ufw keeps 8080 closed.
server {
    listen 127.0.0.1:8080;
    server_name _;
    server_tokens off;
    access_log off;
    location /api/v1/ {
        proxy_pass http://127.0.0.1:6666;
        proxy_http_version 1.1;
        proxy_set_header Host api.meki-us.org;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
        proxy_read_timeout 30s;
    }
    location / { return 404; }
}
