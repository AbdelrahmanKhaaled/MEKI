# MEKI API — nginx reverse proxy on the VPS (docs/54 §4). Replace api.example.org with the real API host name.
# TLS: `certbot --nginx -d api.example.org` (or any ACME client). The Node process listens on 127.0.0.1:6666 ONLY;
# port 6666 must never be opened in the firewall (browsers also refuse it: ERR_UNSAFE_PORT).
limit_req_zone $binary_remote_addr zone=meki_api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name api.example.org;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # Nginx 1.24 uses the listen parameter (the standalone http2 directive needs 1.25+).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.example.org;

    ssl_certificate     /etc/letsencrypt/live/api.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # HSTS on the API host (no includeSubDomains until the domain plan is decided — docs/38 §3.7)
    add_header Strict-Transport-Security "max-age=31536000" always;
    server_tokens off;

    # Media uploads are capped at 10 MB per file by the API; the multipart envelope needs a little more.
    client_max_body_size 12m;
    proxy_read_timeout 120s;

    # Only the API and the public media route are exposed. Private storage (ticket PDFs, SDI reports) is never served by nginx.
    location /api/v1/ {
        limit_req zone=meki_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:6666;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
    }
    location /media/uploads/ {
        proxy_pass http://127.0.0.1:6666;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / { return 404; }
}
